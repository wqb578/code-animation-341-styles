<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>俯仰观照</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    display: block;
    background: #05060A;
  }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
'use strict';

(() => {
  const W = 1920;
  const H = 1080;
  const CX = 960;
  const CY = 540;
  const N = 4000;
  const L = 6000;
  const F0 = 900;

  const V0 = 80;
  const V1 = 2600;
  const DURATION = 12;

  const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
  const smoothstep = (a, b, x) => {
    const u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  };
  const mix = (a, b, u) => a + (b - a) * u;

  const z1 = t => V0 * t + (V1 - V0) * (3 / 3.2) * Math.pow(Math.min(t, 3) / 3, 3.2) + V1 * Math.max(0, t - 3);
  const Z5 = z1(5.0);
  const zB = Z5 + 780;
  const ZC = zB + 900;
  const Z3 = z1(3);
  const ZT = zB - 700;

  function camZ(t) {
    if (t <= 5.0) return z1(t);
    if (t <= 5.6) {
      const u = (t - 5.0) / 0.6;
      return Z5 + 2600 * 0.6 * (u - u * u / 2);
    }
    if (t <= 8.0) {
      const v = (t - 5.6) / 2.4;
      return zB - 2200 * (1 - (1 - v) * (1 - v));
    }
    return zB - 2200 - 120 * (t - 8.0);
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const rand = mulberry32(7);
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  const RING_T = [3.3, 3.72, 4.14, 4.56, 4.98];
  const RING_Z = [];
  for (let k = 0; k < 5; k++) RING_Z.push(Z3 + 2600 * (0.3 + 0.42 * k));
  const RING_COLOR = ['125,249,255', '255,213,154'];

  function focusAt(t) {
    let f = F0;
    for (let k = 0; k < 5; k++) {
      const tk = RING_T[k];
      if (tk <= t) f += 260 * Math.exp(-9 * (t - tk));
    }
    if (t >= 5.6) f += 520 * Math.exp(-6 * (t - 5.6));
    return f;
  }

  function rollAt(t) {
    let r = 0.02 * Math.sin(1.7 * t);
    if (t >= 5.6) {
      const u = t - 5.6;
      r += 0.12 * Math.sin(2 * Math.PI * 0.9 * u) * Math.exp(-2.2 * u);
    }
    return r;
  }

  function speedAt(t) {
    if (t < 3) return 80 + 2520 * Math.pow(t / 3, 2.2);
    if (t <= 5.0) return 2600;
    if (t <= 5.6) return 2600 * (1 - (t - 5.0) / 0.6);
    return 0;
  }

  function makeTitleTargets() {
    const c = document.createElement('canvas');
    c.width = 1200;
    c.height = 400;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.clearRect(0, 0, 1200, 400);
    g.fillStyle = '#fff';
    g.font = 'bold 280px "Noto Serif SC","Songti SC","SimSun",serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('俯仰观照', 600, 205);

    const img = g.getImageData(0, 0, 1200, 400).data;
    const pts = [];
    for (let y = 0; y < 400; y += 3) {
      for (let x = 0; x < 1200; x += 3) {
        if (img[(y * 1200 + x) * 4 + 3] > 128) {
          pts.push([(x - 600) * 2.093, (y - 200) * 2.093]);
        }
      }
    }

    for (let i = pts.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const tmp = pts[i];
      pts[i] = pts[j];
      pts[j] = tmp;
    }

    const out = new Float32Array(N * 2);
    if (pts.length === 0) {
      for (let i = 0; i < N; i++) {
        const u = i / N;
        out[i * 2] = (u - 0.5) * 1800;
        out[i * 2 + 1] = Math.sin(u * Math.PI * 8) * 160;
      }
      return out;
    }

    for (let i = 0; i < N; i++) {
      const p = pts[i % pts.length];
      if (i >= pts.length) {
        out[i * 2] = p[0] + (rand() * 2 - 1) * 3;
        out[i * 2 + 1] = p[1] + (rand() * 2 - 1) * 3;
      } else {
        out[i * 2] = p[0];
        out[i * 2 + 1] = p[1];
      }
    }
    return out;
  }

  const targets = makeTitleTargets();
  const group0 = [];
  const group1 = [];

  for (let i = 0; i < N; i++) {
    const a = rand() * Math.PI * 2;
    const rho = 220 + 1280 * Math.pow(rand(), 0.8);
    const zw = rand() * L;
    const s = rand();
    const cls = rand() < 0.15 ? 1 : 0;
    const ph = rand() * Math.PI * 2;
    const fq = 0.6 + 1.0 * rand();

    const zz = -0.55 + 1.55 * rand();
    const phi = rand() * Math.PI * 2;
    const rxy = Math.sqrt(Math.max(0, 1 - zz * zz));
    const dirx = rxy * Math.cos(phi);
    const diry = rxy * Math.sin(phi);
    const dirz = zz;

    const mag = 300 + 2600 * Math.pow(rand(), 1.6);
    const sign = rand() < 0.5 ? -1 : 1;
    const sw = (1.2 + 2 * rand()) * sign;

    const p = {
      a, ca: Math.cos(a), sa: Math.sin(a),
      rho, zw, s, cls, ph, fq,
      dirx, diry, dirz, mag, sw,
      tx: targets[i * 2],
      ty: targets[i * 2 + 1]
    };
    (cls ? group1 : group0).push(p);
  }

  function place(p, t, cam, out) {
    let X, Y, d;

    if (t < 5.6) {
      const k = 1 - 0.92 * smoothstep(5.0, 5.6, t);
      X = p.rho * p.ca * k;
      Y = p.rho * p.sa * k;
      d = ((p.zw - cam) % L + L) % L + 60;
    } else if (t <= 8) {
      const tau = Math.min(1, (t - 5.6) / 2.4);
      const g = 1 - (1 - tau) * (1 - tau) * (1 - tau);
      X = p.dirx * p.mag * g;
      Y = p.diry * p.mag * g;
      const Z = ZC + p.dirz * p.mag * g;
      d = Z - cam;
    } else {
      const e = smoothstep(8, 10, t);
      const ex = p.dirx * p.mag;
      const ey = p.diry * p.mag;
      const ez = ZC + p.dirz * p.mag;
      const qx = ex + (p.tx - ex) * e;
      const qy = ey + (p.ty - ey) * e;
      const qz = ez + (ZT - ez) * e;
      const theta = Math.sin(Math.PI * e) * p.sw;
      const ct = Math.cos(theta);
      const st = Math.sin(theta);
      X = qx * ct - qy * st;
      Y = qx * st + qy * ct;
      d = qz - cam;
    }

    out.x = X;
    out.y = Y;
    out.d = d;
    return out;
  }

  function palette(t) {
    let r0 = 191, g0 = 232, b0 = 255;
    let r1 = 255, g1 = 213, b1 = 154;

    if (t >= 5.6) {
      if (t < 8) {
        const tau = Math.min(1, (t - 5.6) / 2.4);
        if (tau < 0.4) {
          const u = tau / 0.4;
          r0 = mix(255, 255, u); g0 = mix(255, 176, u); b0 = mix(255, 74, u);
        } else {
          const u = (tau - 0.4) / 0.6;
          r0 = mix(255, 255, u); g0 = mix(176, 61, u); b0 = mix(74, 110, u);
        }
      } else if (t < 10) {
        const u = smoothstep(8, 10, t);
        r0 = mix(255, 246, u);
        g0 = mix(61, 235, u);
        b0 = mix(110, 208, u);
      } else {
        r0 = 246; g0 = 235; b0 = 208;
      }
      r1 = r0; g1 = g0; b1 = b0;
    } else if (t >= 5.0) {
      const u = smoothstep(5.0, 5.6, t);
      r0 = mix(191, 255, u); g0 = mix(232, 255, u); b0 = mix(255, 255, u);
      r1 = mix(255, 255, u); g1 = mix(213, 255, u); b1 = mix(154, 255, u);
    }

    return {
      c0: 'rgb(' + (r0 | 0) + ',' + (g0 | 0) + ',' + (b0 | 0) + ')',
      c1: 'rgb(' + (r1 | 0) + ',' + (g1 | 0) + ',' + (b1 | 0) + ')'
    };
  }

  const OUT_A = { x: 0, y: 0, d: 0 };
  const OUT_B = { x: 0, y: 0, d: 0 };

  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = '#05060A';
    ctx.fillRect(0, 0, W, H);

    const sf = 0.45 + 0.55 * clamp(speedAt(t) / 2600, 0, 1);
    const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 700);
    bg.addColorStop(0, 'rgba(30,60,90,' + (0.28 * sf * (t < 5.6 ? 1 : 0.4)) + ')');
    bg.addColorStop(1, 'rgba(5,6,10,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const f = focusAt(t);
    const roll = rollAt(t);
    const amp = t >= 5.6 ? 22 * Math.exp(-3.2 * (t - 5.6)) : 0;
    const shakeX = Math.sin(53 * t) * amp;
    const shakeY = Math.cos(47 * t) * amp;

    ctx.save();
    ctx.translate(CX + shakeX, CY + shakeY);
    ctx.rotate(roll);
    ctx.translate(-CX, -CY);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    const dt = t < 5.6 ? 0.03 : 0.06 - 0.03 * smoothstep(8, 9, t);
    const tp = Math.max(t - dt, t >= 5.6 ? 5.6 : 0);
    const fp = focusAt(tp);
    const pal = palette(t);
    const tau8 = Math.min(1, (t - 5.6) / 2.4);
    const camA = camZ(tp);
    const camB = camZ(t);

    for (let g = 0; g < 2; g++) {
      const list = g === 0 ? group0 : group1;
      ctx.strokeStyle = g === 0 ? pal.c0 : pal.c1;
      for (let j = 0; j < list.length; j++) {
        const p = list[j];
        place(p, tp, camA, OUT_A);
        place(p, t, camB, OUT_B);

        if (OUT_A.d < 30 || OUT_B.d < 30) continue;
        if (Math.abs(OUT_A.d - OUT_B.d) > 500) continue;

        let alpha, lw;
        if (t < 5.6) {
          const d = OUT_B.d;
          alpha = Math.pow(clamp(1 - d / L, 0, 1), 1.4) * (0.25 + 0.55 * p.s) * sf * 1.6;
          alpha = clamp(alpha, 0, 1);
          lw = (0.9 + 1.8 * p.s) * clamp(Math.sqrt(900 / d), 0.5, 2.2);
        } else {
          alpha = 0.9 * (0.7 + 0.3 * Math.sin(p.fq * t + p.ph)) * (t < 8 ? 1 - 0.4 * tau8 : 0.9);
          lw = (2 + 3 * p.s) * clamp(Math.sqrt(900 / OUT_B.d), 0.6, 2.2);
        }
        if (alpha <= 0.004) continue;

        const ax = CX + fp * OUT_A.x / OUT_A.d;
        const ay = CY + fp * OUT_A.y / OUT_A.d;
        const bx = CX + f * OUT_B.x / OUT_B.d;
        const by = CY + f * OUT_B.y / OUT_B.d;

        if (Math.max(ax, bx) < -16 || Math.min(ax, bx) > W + 16 ||
            Math.max(ay, by) < -16 || Math.min(ay, by) > H + 16) continue;

        ctx.globalAlpha = alpha;
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }
    }

    if (t < 5.6) {
      const cam = camZ(t);
      for (let k = 0; k < 5; k++) {
        const d = RING_Z[k] - cam;
        if (d < 40 || d > 5200) continue;
        const alpha = 0.6 * clamp(1 - d / 5200, 0, 1);
        const lw = clamp(6 * 900 / d, 1.5, 16);
        const rr = f * 260 / d;
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = 'rgba(' + RING_COLOR[k % 2] + ',1)';
        ctx.lineWidth = lw;
        ctx.beginPath();
        for (let j = 0; j <= 96; j++) {
          const th = j / 96 * Math.PI * 2;
          const x = CX + rr * Math.cos(th);
          const y = CY + rr * Math.sin(th);
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = alpha * 0.25;
        ctx.lineWidth = lw * 3;
        ctx.stroke();
      }
    }

    if (t >= 4.4) {
      const dc = ZC - camZ(t);
      if (dc > 40) {
        let radius = 140000 / dc * (0.4 + 0.6 * smoothstep(4.4, 5.6, t)) * (f / 900);
        if (t >= 5.6) radius *= Math.exp(-3 * (t - 5.6));
        if (radius > 0.5) {
          const cg = ctx.createRadialGradient(CX, CY, 0, CX, CY, radius);
          cg.addColorStop(0, 'rgba(255,255,255,0.9)');
          cg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.globalAlpha = 1;
          ctx.fillStyle = cg;
          ctx.beginPath();
          ctx.arc(CX, CY, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    if (t >= 5.6) {
      const ts = clamp((t - 5.6) / 1.2, 0, 1);
      if (ts < 1) {
        const dd = ZC - camZ(t);
        if (dd > 40) {
          const Rw = 3600 * (1 - Math.pow(1 - ts, 3));
          const rr = f * Rw / dd;
          ctx.globalAlpha = 0.8 * (1 - ts);
          ctx.strokeStyle = 'rgba(255,255,255,1)';
          ctx.lineWidth = 1 + 8 * (1 - ts);
          ctx.beginPath();
          ctx.arc(CX, CY, rr, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    ctx.restore();

    let flash = t >= 5.6 ? 0.95 * Math.exp(-9 * (t - 5.6)) : 0.7 * smoothstep(5.4, 5.6, t);
    for (let k = 0; k < 5; k++) {
      if (RING_T[k] <= t) flash += 0.3 * Math.exp(-14 * (t - RING_T[k]));
    }
    if (t >= 10) flash += 0.35 * Math.exp(-8 * (t - 10));
    flash = clamp(flash, 0, 1);
    if (flash > 0.001) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = flash;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    const titleA = 0.9 * smoothstep(9.7, 10.3, t) * (1 - smoothstep(11.4, 12, t));
    if (titleA > 0.001) {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = titleA;
      ctx.fillStyle = '#F6EBD0';
      ctx.font = 'bold 300px "Noto Serif SC","Songti SC","SimSun",serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('俯仰观照', 960, 545);
      ctx.restore();
    }

    const subA = 0.85 * smoothstep(9.6, 10.4, t) * (1 - smoothstep(11.4, 12, t));
    if (subA > 0.001) {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = subA;
      ctx.fillStyle = '#EDE6D6';
      ctx.font = '40px "Noto Serif SC","Songti SC","SimSun",serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('于江流见瞬息，于树木见永恒', 960, 790);
      ctx.restore();
    }

    const vg = ctx.createRadialGradient(CX, CY, 400, CX, CY, 1150);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    const fade = (1 - smoothstep(0, 0.35, t)) + smoothstep(11.4, 12, t);
    if (fade > 0.001) {
      ctx.globalAlpha = clamp(fade, 0, 1);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function fit() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  const queryT = new URLSearchParams(location.search).get('t');
  const staticT = queryT !== null && queryT !== '' ? parseFloat(queryT) : NaN;

  if (Number.isFinite(staticT)) {
    draw(clamp(staticT, 0, DURATION));
    return;
  }

  let elapsed = 0;
  let last = performance.now();
  let paused = false;

  window.addEventListener('keydown', event => {
    if (event.code === 'Space') {
      event.preventDefault();
      paused = !paused;
    }
  });

  function frame(now) {
    const delta = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    if (!paused) elapsed += delta;
    draw(elapsed % DURATION);
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
